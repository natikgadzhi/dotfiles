# remap prefix from 'C-b' to Ctrl + Space
unbind C-b
set -g prefix C-Space
set -g prefix2 C-@
bind C-Space send-prefix
bind C-@ send-prefix

set -g mouse on
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on
set -g set-clipboard on

# Let applications reach the outer terminal directly. Some TUIs wrap their
# OSC 52 clipboard writes in the tmux passthrough sequence, and tmux drops
# those silently while this is off.
set -g allow-passthrough on

# Send escape immediately
set -sg escape-time 0

# Set default shell to Fish, wherever it lives on this machine
# (/opt/homebrew/bin on macOS, /usr/bin on Linux). If fish isn't
# installed, leave tmux on its own default.
if-shell 'command -v fish >/dev/null 2>&1' \
  'run-shell "tmux set-option -g default-shell $(command -v fish)"'

set-option -s extended-keys always
set-option -as terminal-features 'xterm*:extkeys'
set-option -as terminal-features 'xterm*:hyperlinks'

# manage windows
# Set base window index to 1 so they start from 1, not 0.
bind c new-window -c "#{pane_current_path}"
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# Auto-rename windows to show current directory basename
set-option -g allow-rename on
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path}#(~/.config/tmux/window-name.sh '#{pane_current_command}')"

# Set terminal title to "tmux: window-name"
set-option -g set-titles on
set-option -g set-titles-string "tmux: #W"

# set long history buffer
set-option -g history-limit 10000

# Navigate windows with Alt + [ and Alt + ]
bind -n M-[ previous-window
bind -n M-] next-window

# Jump to window by index with Opt + number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# opencode palette: border grey (#323232), active pane in primary (#fab283)
set -g pane-border-style "fg=#323232"
set -g pane-active-border-style "fg=#fab283"

# split panes using v and h respectively
# defaults are % and somethin
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file on ctrl-a r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"


# Shift+hjkl = 6-cell increments (coarse)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl+Arrow = 1-cell increments (fine)
bind -r C-Left resize-pane -L 1
bind -r C-Down resize-pane -D 1
bind -r C-Up resize-pane -U 1
bind -r C-Right resize-pane -R 1

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Toggle the status bar on/off. A bare `set status` flips a boolean option.
bind S set -g status

# Focus mode: zoom the current pane and hide the status bar in one key.
# Both halves toggle, so the same key restores. Note this shadows the
# default `prefix f` (find-window) — use `prefix w` to pick a window.
bind f resize-pane -Z \; set -g status

bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Use vi key bindings in copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
unbind -T copy-mode-vi Enter

# Where a yank goes depends on the host. On macOS pbcopy takes it: OSC 52 caps
# how much a single escape can carry and pbcopy does not, so long selections
# survive. A headless remote box has no pbcopy, and xsel and wl-copy have no
# display to write to, so piping anywhere is pointless there. Plain
# copy-selection is what works: creating the buffer makes set-clipboard (line
# 12) emit OSC 52 back over ssh, the only route to the local clipboard.
if-shell 'command -v pbcopy > /dev/null' {
    bind-key -T copy-mode-vi 'y'               send -X copy-pipe-and-cancel pbcopy
    bind-key -T copy-mode-vi Enter             send -X copy-pipe-and-cancel pbcopy
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
    bind-key -T root DoubleClick1Pane select-pane \; copy-mode \; send -X select-word \; send -X copy-pipe-and-cancel pbcopy
    bind-key -T root TripleClick1Pane select-pane \; copy-mode \; send -X select-line \; send -X copy-pipe-and-cancel pbcopy
} {
    bind-key -T copy-mode-vi 'y'               send -X copy-selection-and-cancel
    bind-key -T copy-mode-vi Enter             send -X copy-selection-and-cancel
    bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
    bind-key -T root DoubleClick1Pane select-pane \; copy-mode \; send -X select-word \; send -X copy-selection-and-cancel
    bind-key -T root TripleClick1Pane select-pane \; copy-mode \; send -X select-line \; send -X copy-selection-and-cancel
}

bind -T copy-mode-vi WheelUpPane send -N3 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N3 -X scroll-down

# 
# STATUS LINE — opencode palette (mirroring lualine section blocks)
#
# Same colours as Ghostty themes/opencode, nvim (mini.base16) and Claude Code
# (dark-ansi). #141414 is opencode's panel background, #fab283 its primary —
# the peach that was Doom One's blue here.
#
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=#141414,fg=#808080"

# Left: [session] block in primary
set -g status-left "#[bg=#fab283,fg=#0a0a0a,bold] #S #[bg=#141414] "
set -g status-left-length 30

# Right: window list + time (windows on the right, matching nvim lualine layout)
set -g status-right-length 120

# Window list — active window gets a primary bg block like lualine's active section
# Positioned on the right via status-justify
set -g status-justify right
setw -g window-status-format "#[bg=#141414,fg=#606060] #I:#W "
setw -g window-status-current-format "#[bg=#fab283,fg=#0a0a0a,bold] #I:#W #[bg=#141414]"
setw -g window-status-separator ""

# After window list: [time] in a primary block
set -g status-right "#[bg=#fab283,fg=#0a0a0a,bold] %I:%M %p "

# Selection / copy mode
set -g mode-style "bg=#fab283,fg=#0a0a0a"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Clear the screen and the scrollback together. This has to sit below the TPM
# run above. vim-tmux-navigator claims bare C-l for pane-right and then rebinds
# prefix C-l to a plain `send-keys C-l` as a courtesy, which drops the
# clear-history half. Loading after the plugin is what makes this one stick.
bind C-l send-keys C-l \; run-shell "sleep 0.1" \; clear-history
